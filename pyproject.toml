[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "documind-rag"
version = "0.1.0"
description = "DocuMind: a RAG-based document Q&A assistant with source citations (LangChain + ChromaDB + FastAPI + Streamlit)."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Rajan Kumar Saini" }]
requires-python = ">=3.11"
dependencies = [
    "langchain-core>=1.0",
    "langchain-text-splitters>=1.0",
    "langchain-chroma>=1.0",
    "langchain-openai>=1.0",
    "langchain-huggingface>=1.0",
    "chromadb>=1.0",
    "pypdf>=5.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pandas>=2.2",
    "numpy>=1.26",
    "tabulate>=0.9",
]

[project.optional-dependencies]
# Local Hugging Face embedding models (pulls in PyTorch, so it is kept optional).
hf = ["sentence-transformers>=3.0"]
ui = ["streamlit>=1.38", "requests>=2.32"]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "reportlab>=4.0",
    "streamlit>=1.38",
    "requests>=2.32",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["data", "chroma_data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N"]
ignore = [
    "B008",   # FastAPI's Depends()/File() in argument defaults is idiomatic
    "SIM905", # a multi-line "...".split() word list reads better than a long list literal
]

[tool.ruff.lint.isort]
known-first-party = ["documind"]
