services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      CHROMA_DIR: /data/chroma
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/data/chroma # vector store survives container restarts
      - model_cache:/models # downloaded Hugging Face models
    restart: unless-stopped

  ui:
    build:
      context: .
      dockerfile: docker/ui.Dockerfile
    environment:
      BACKEND_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  chroma_data:
  model_cache:
